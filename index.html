<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ménage de l'appart</title>
<style>
  :root {
    --bg: #f5f3ee; --card: #fff; --ink: #1d1d1b; --muted: #77746d; --line: #e4e0d7;
    --ok: #2f8f5b; --ok-bg: #e6f4ec; --accent: #1d1d1b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .week { display: flex; align-items: center; justify-content: space-between; gap: 8px;
          background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
  .week button { width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--bg);
                 font-size: 20px; cursor: pointer; color: var(--ink); }
  .week .label { text-align: center; }
  .week .label strong { display: block; font-size: 17px; }
  .week .label span { font-size: 13px; color: var(--muted); }
  .today-link { display: block; margin: 8px auto 0; background: none; border: 0; color: var(--muted);
                font-size: 13px; text-decoration: underline; cursor: pointer; }
  .progress { margin: 16px 0 10px; font-size: 14px; color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--ok); transition: width .25s; }
  .task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
          margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .task.done { background: var(--ok-bg); border-color: #bfe3cd; }
  .task.mine:not(.done) { border: 2px solid var(--ink); }
  .task .icon { font-size: 26px; width: 36px; text-align: center; }
  .task .info { flex: 1; min-width: 0; }
  .task .name { font-weight: 600; font-size: 16px; }
  .task select { margin-top: 4px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px;
                 padding: 4px 6px; background: var(--bg); color: var(--ink); max-width: 100%; }
  .task .when { font-size: 12px; color: var(--ok); margin-top: 4px; }
  .check { flex-shrink: 0; height: 48px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--ink);
           background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--ink); }
  .done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
  h2 { font-size: 15px; margin: 24px 0 8px; }
  textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 12px;
             padding: 10px; font: inherit; font-size: 15px; background: var(--card); resize: vertical; }
  .scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .score { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px;
           text-align: center; }
  .score b { display: block; font-size: 20px; }
  .score span { font-size: 13px; color: var(--muted); }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
          margin-bottom: 10px; }
  .item .top { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
  .item .top small { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .seg button { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
                font-size: 14px; cursor: pointer; color: var(--ink); }
  .seg button.on.s0 { background: var(--ok); border-color: var(--ok); color: #fff; }
  .seg button.on.s1 { background: #e8a33a; border-color: #e8a33a; color: #fff; }
  .seg button.on.s2 { background: #d0473c; border-color: #d0473c; color: #fff; }
  .me { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin: -6px 0 14px; }
  .me select { font-size: 15px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px;
               background: var(--card); color: var(--ink); }
  .sync { margin-left: auto; font-size: 12px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧽 Ménage de l'appart</h1>
  <div class="me">Je suis :
    <select id="me"><option value="">— choisir —</option></select>
    <span id="sync" class="sync"></span>
  </div>

  <div class="week">
    <button id="prev" aria-label="Semaine précédente">‹</button>
    <div class="label"><strong id="weekTitle"></strong><span id="weekSub"></span></div>
    <button id="next" aria-label="Semaine suivante">›</button>
  </div>
  <button class="today-link" id="today" hidden>Revenir à cette semaine</button>

  <div class="progress"><span id="progText"></span><div class="bar"><i id="progBar"></i></div></div>

  <div id="tasks"></div>

  <h2>🛒 Réserves</h2>
  <div id="stock"></div>

  <h2>📝 Notes de la semaine</h2>
  <textarea id="notes" placeholder="Absences, plantes, lessive, courses, dépenses…"></textarea>

  <h2>🏆 Tâches faites (total)</h2>
  <div class="scores" id="scores"></div>
  <p class="hint">La rotation change automatiquement chaque lundi. Tu peux changer la personne d'une tâche avec le menu.</p>
</div>

<script type="module">
// ⬇️ Colle ici la config Firebase (Paramètres du projet → Vos applications → SDK). Laisse null = mode local.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDmldydffBjhIq0elDvSJ3Fh9xbP31iNBY",
  authDomain: "menage-appart.firebaseapp.com",
  databaseURL: "https://menage-appart-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "menage-appart",
  storageBucket: "menage-appart.firebasestorage.app",
  messagingSenderId: "105490657468",
  appId: "1:105490657468:web:e248ef4cfc419954c9a0b9",
};

const PEOPLE = ["Connor", "Rémi", "Noé", "Antoine"];
// 8 tâches, 2 par personne. La tâche n et la tâche n+4 vont à la même personne :
// Cuisine + Poubelles, Salle de bain + Toilettes, Sols + Couloir, Salon + Plantes.
const TASKS = [
  { id: "kitchen", name: "Cuisine",       icon: "🍳" },
  { id: "bath",    name: "Salle de bain", icon: "🛁" },
  { id: "floors",  name: "Sols",          icon: "🧹" },
  { id: "living",  name: "Salon",         icon: "🛋️" },
  { id: "trash",   name: "Poubelles",     icon: "🗑️" },
  { id: "toilets", name: "Toilettes",     icon: "🚽" },
  { id: "hallway", name: "Couloir",       icon: "🚪" },
  { id: "plants",  name: "Plantes",       icon: "🪴" },
];
const SUPPLIES = [
  { id: "products", name: "Produits ménagers", icon: "🧴" },
  { id: "bags",     name: "Sacs poubelle",     icon: "🛍️" },
  { id: "tp",       name: "PQ",                icon: "🧻" },
];
const LEVELS = ["✅ OK", "⚠️ Bientôt fini", "🛒 À acheter"];
// Semaine de référence : lundi 9 nov. 2026.
const REF_MONDAY = new Date(2026, 10, 9);
const MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

// ---------- Stockage : Firebase si configuré, sinon local ----------
// Données : { weeks: { "2026-11-09": { assign:{}, done:{}, notes:"" } }, stock: { tp:{level,by,date} } }
let data = {};
let write; // write(path, value) ; value null = supprimer
const sync = document.getElementById("sync");

if (FIREBASE_CONFIG) {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getDatabase, ref, onValue, set } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const db = getDatabase(initializeApp(FIREBASE_CONFIG));
  sync.textContent = "⏳ connexion…";
  // Les règles n'ouvrent que /weeks et /stock : on écoute ces deux branches.
  for (const key of ["weeks", "stock"]) {
    onValue(ref(db, key), snap => { data[key] = snap.val() || {}; sync.textContent = "🟢 en ligne"; render(); },
            err => { sync.textContent = "🔴 erreur d'accès"; console.error(err); });
  }
  onValue(ref(db, ".info/connected"), s => { if (!s.val()) sync.textContent = "🔴 hors ligne"; });
  write = (path, value) => set(ref(db, path), value);
} else {
  const KEY = "menage-appart-v2";
  data = JSON.parse(localStorage.getItem(KEY) || "{}");
  sync.textContent = "📱 local";
  write = (path, value) => {
    const parts = path.split("/"); let o = data;
    parts.slice(0, -1).forEach(p => o = (o[p] ||= {}));
    if (value === null) delete o[parts.at(-1)]; else o[parts.at(-1)] = value;
    localStorage.setItem(KEY, JSON.stringify(data)); render();
  };
}

// ---------- Dates ----------
function mondayOf(d) {
  const m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
  return m;
}
const keyOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const weeksBetween = (a, b) => Math.round((b - a) / (7 * 864e5));
const mod = (n, m) => ((n % m) + m) % m;
const today = () => { const n = new Date(); return `${n.getDate()} ${MONTHS[n.getMonth()]}`; };
const thisMonday = mondayOf(new Date());
let current = new Date(thisMonday);
const defaultPerson = (i, monday) => PEOPLE[mod(i + weeksBetween(REF_MONDAY, monday), PEOPLE.length)];

// ---------- "Je suis" (mémorisé sur l'appareil) ----------
const meSel = document.getElementById("me");
meSel.innerHTML += PEOPLE.map(p => `<option>${p}</option>`).join("");
meSel.value = localStorage.getItem("menage-me") || "";
meSel.onchange = () => { localStorage.setItem("menage-me", meSel.value); render(); };

// ---------- Affichage ----------
function render() {
  const k = keyOf(current);
  const w = (data.weeks || {})[k] || {};
  const assign = w.assign || {}, done = w.done || {};
  const sun = new Date(current); sun.setDate(sun.getDate() + 6);
  const diff = weeksBetween(thisMonday, current);
  const me = meSel.value;

  document.getElementById("weekTitle").textContent =
    diff === 0 ? "Cette semaine" : diff === 1 ? "Semaine prochaine" : diff === -1 ? "Semaine dernière"
    : diff > 0 ? `Dans ${diff} semaines` : `Il y a ${-diff} semaines`;
  document.getElementById("weekSub").textContent =
    `${current.getDate()} ${MONTHS[current.getMonth()]} – ${sun.getDate()} ${MONTHS[sun.getMonth()]}`;
  document.getElementById("today").hidden = diff === 0;

  const box = document.getElementById("tasks");
  box.innerHTML = "";
  let doneCount = 0;
  TASKS.forEach((t, i) => {
    const who = assign[t.id] || defaultPerson(i, current);
    const d = done[t.id];
    if (d) doneCount++;
    const el = document.createElement("div");
    el.className = "task" + (d ? " done" : "") + (who === me ? " mine" : "");
    el.innerHTML = `
      <div class="icon">${t.icon}</div>
      <div class="info">
        <div class="name">${t.name}</div>
        <select aria-label="Personne pour ${t.name}">
          ${PEOPLE.map(p => `<option ${p === who ? "selected" : ""}>${p}</option>`).join("")}
        </select>
        ${d ? `<div class="when">Fait par ${d.by} le ${d.date}</div>` : ""}
      </div>
      <button class="check">${d ? "✓ Fait" : "Fait ?"}</button>`;
    el.querySelector("select").onchange = e => write(`weeks/${k}/assign/${t.id}`, e.target.value);
    el.querySelector(".check").onclick = () => {
      if (d) {
        if (confirm(`Annuler la validation de « ${t.name} » ?`)) write(`weeks/${k}/done/${t.id}`, null);
      } else write(`weeks/${k}/done/${t.id}`, { by: who, date: today() });
    };
    box.appendChild(el);
  });
  document.getElementById("progText").textContent = `${doneCount} / ${TASKS.length} tâches faites`;
  document.getElementById("progBar").style.width = `${doneCount / TASKS.length * 100}%`;

  const stock = data.stock || {};
  document.getElementById("stock").innerHTML = SUPPLIES.map(s => {
    const st = stock[s.id] || { level: 0 };
    return `<div class="item"><div class="top">${s.icon} ${s.name}
        ${st.by ? `<small>${st.by} · ${st.date}</small>` : ""}</div>
      <div class="seg">${LEVELS.map((l, i) =>
        `<button class="s${i} ${st.level === i ? "on" : ""}" data-s="${s.id}" data-l="${i}">${l}</button>`).join("")}
      </div></div>`;
  }).join("");
  document.querySelectorAll("#stock button").forEach(b => b.onclick = () => {
    if (!meSel.value) { alert("Choisis d'abord qui tu es en haut de la page 🙂"); meSel.focus(); return; }
    write(`stock/${b.dataset.s}`, { level: +b.dataset.l, by: meSel.value, date: today() });
  });

  const notes = document.getElementById("notes");
  if (document.activeElement !== notes) notes.value = w.notes || "";

  const totals = Object.fromEntries(PEOPLE.map(p => [p, 0]));
  Object.values(data.weeks || {}).forEach(wk => Object.values(wk.done || {}).forEach(x => { if (x.by in totals) totals[x.by]++; }));
  document.getElementById("scores").innerHTML =
    PEOPLE.map(p => `<div class="score"><b>${totals[p]}</b><span>${p}</span></div>`).join("");
}

let notesTimer;
document.getElementById("notes").oninput = e => {
  clearTimeout(notesTimer);
  const k = keyOf(current), v = e.target.value;
  notesTimer = setTimeout(() => write(`weeks/${k}/notes`, v), 600);
};
document.getElementById("prev").onclick = () => { current.setDate(current.getDate() - 7); render(); };
document.getElementById("next").onclick = () => { current.setDate(current.getDate() + 7); render(); };
document.getElementById("today").onclick = () => { current = new Date(thisMonday); render(); };
render();
</script>
</body>
</html>
